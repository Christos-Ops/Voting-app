services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voting
      POSTGRES_USER: voting
      POSTGRES_PASSWORD: voting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voting -d voting"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://voting:voting@db:5432/voting
      WORKER_DATABASE_URL: postgresql://voting:voting@db:5432/voting
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-to-a-long-random-secret
      RESULTS_CACHE_TTL: "30"
      LOG_LEVEL: INFO
    ports:
      - "5000:5000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORKER_DATABASE_URL: postgresql://voting:voting@db:5432/voting
      DATABASE_URL: postgresql+psycopg://voting:voting@db:5432/voting
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: "3001"
      LOG_LEVEL: INFO
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
