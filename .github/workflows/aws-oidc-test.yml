name: AWS OIDC identity test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-oidc:
    name: Inspect GitHub OIDC token
    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC token claims
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('OIDC repository:', payload.repository);
            console.log('OIDC ref:', payload.ref);

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::725072161011:role/Voting-appIAM
          aws-region: us-east-2
          role-session-name: GitHubActionsOidcTest

      - name: Display AWS caller identity
        run: aws sts get-caller-identity
