name: Check, build, and publish images

on:
  push:
    branches:
      - main
      - staging
  pull_request:

permissions:
  contents: read

jobs:
  codeql:
    name: Code security analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build CodeQL database
        uses: github/codeql-action/autobuild@v3

      - name: Analyze code
        uses: github/codeql-action/analyze@v3

  checks:
    name: Tests and dependency/security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install worker dependencies
        run: npm ci

      - name: Run worker tests
        run: npm run test:worker

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check Compose configuration
        run: docker compose config --quiet

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build-and-publish:
    name: Build, scan, and publish Docker images
    runs-on: ubuntu-latest
    needs:
      - codeql
      - checks
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag voting-app-api:${{ github.sha }} --file Dockerfile .

      - name: Build worker image
        run: docker build --tag voting-app-worker:${{ github.sha }} --file Dockerfile.worker .

      - name: Build frontend image
        run: docker build --tag voting-app-frontend:${{ github.sha }} --file frontend/Dockerfile ./frontend

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: voting-app-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: voting-app-worker:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: voting-app-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for image in api worker frontend; do
            local_image="voting-app-${image}:${GITHUB_SHA}"
            remote_image="${DOCKERHUB_USERNAME}/voting-app-${image}"
            docker tag "${local_image}" "${remote_image}:${GITHUB_SHA}"
            docker tag "${local_image}" "${remote_image}:latest"
            docker push "${remote_image}:${GITHUB_SHA}"
            docker push "${remote_image}:latest"
          done
