name: Check, build, and publish images

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  codeql:
    name: Code security analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build CodeQL database
        uses: github/codeql-action/autobuild@v3

      - name: Analyze code
        uses: github/codeql-action/analyze@v3

  checks:
    name: Tests and dependency/security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install worker dependencies
        run: npm ci

      - name: Run worker tests
        run: npm run test:worker

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check Compose configuration
        run: docker compose config --quiet

      - name: Check production Compose configuration
        run: IMAGE_TAG=validation docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build-and-publish:
    name: Build, scan, and publish Docker images
    runs-on: ubuntu-latest
    needs:
      - codeql
      - checks
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag voting-app-api:${{ github.sha }} --file Dockerfile .

      - name: Build worker image
        run: docker build --tag voting-app-worker:${{ github.sha }} --file Dockerfile.worker .

      - name: Build frontend image
        run: docker build --tag voting-app-frontend:${{ github.sha }} --file frontend/Dockerfile ./frontend

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: voting-app-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: voting-app-worker:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: voting-app-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for image in api worker frontend; do
            local_image="voting-app-${image}:${GITHUB_SHA}"
            remote_image="${DOCKERHUB_USERNAME}/voting-app-${image}"
            docker tag "${local_image}" "${remote_image}:${GITHUB_SHA}"
            docker tag "${local_image}" "${remote_image}:latest"
            docker push "${remote_image}:${GITHUB_SHA}"
            docker push "${remote_image}:latest"
          done

  deploy-production:
    name: Deploy production through SSM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::725072161011:role/Voting-appIAM
          aws-region: us-east-2
          role-session-name: VotingAppProductionDeploy

      - name: Deploy commit images to EC2 with SSM
        env:
          EC2_INSTANCE_ID: i-0833f8deb41bb502d
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          remote_script="$(printf 'REPOSITORY=%q\nIMAGE_TAG=%q\n' "$REPOSITORY" "$IMAGE_TAG"
          cat <<'REMOTE'
          set -eu

          if [ "$(id -u)" -ne 0 ]; then
            echo "SSM deployment command must run as root." >&2
            exit 1
          fi

          APP_DIR=/opt/voting-app
          COMPOSE_FILE="$APP_DIR/docker-compose.prod.yml"
          ENV_FILE="$APP_DIR/.env"

          if [ ! -s "$ENV_FILE" ]; then
            echo "Required production environment file is missing: $ENV_FILE" >&2
            exit 1
          fi
          chmod 600 "$ENV_FILE"

          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            . /etc/os-release
            ubuntu_codename="${UBUNTU_CODENAME:-${VERSION_CODENAME:-}}"
            if [ -z "$ubuntu_codename" ]; then
              echo "Unable to determine the Ubuntu release codename." >&2
              exit 1
            fi
            cat > /etc/apt/sources.list.d/docker.sources <<DOCKER_APT
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: $ubuntu_codename
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          DOCKER_APT
            apt-get update
            if ! command -v docker >/dev/null 2>&1; then
              apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            elif ! docker compose version >/dev/null 2>&1; then
              apt-get install -y docker-compose-plugin
            fi
          fi

          systemctl enable --now docker
          docker compose version

          install -d -m 0755 "$APP_DIR"
          compose_url="https://raw.githubusercontent.com/$REPOSITORY/$IMAGE_TAG/docker-compose.prod.yml"
          curl --fail --silent --show-error --location "$compose_url" -o "$COMPOSE_FILE.tmp"
          mv "$COMPOSE_FILE.tmp" "$COMPOSE_FILE"
          cd "$APP_DIR"

          export IMAGE_TAG
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" config --quiet
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans

          for service in db redis api worker frontend; do
            container_id=""
            state="missing"
            for attempt in $(seq 1 60); do
              container_id="$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps --all -q "$service" | head -n 1)"
              if [ -n "$container_id" ]; then
                state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
                if [ "$state" = healthy ]; then
                  break
                fi
              fi
              sleep 5
            done
            if [ "$state" != healthy ]; then
              echo "Service $service did not become healthy; last state: $state" >&2
              exit 1
            fi
            echo "Service $service is healthy."
          done

          echo "Deployment of $IMAGE_TAG passed all service health checks."
          REMOTE
          )"

          parameters="$(jq -n --arg script "$remote_script" '{commands: [$script]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy voting app commit $IMAGE_TAG" \
            --timeout-seconds 1800 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command submitted: $command_id"

          for attempt in $(seq 1 360); do
            invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)"
            status="$(jq -r '.Status // empty' <<< "$invocation")"
            case "$status" in
              Success)
                jq -r '.StandardOutputContent // empty' <<< "$invocation"
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                jq -r '.StandardOutputContent // empty' <<< "$invocation"
                jq -r '.StandardErrorContent // empty' <<< "$invocation" >&2
                echo "SSM deployment command ended with status: $status" >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for SSM deployment command $command_id." >&2
          exit 1
